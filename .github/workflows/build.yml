name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ steps.find_root.outputs.root_dir || '.' }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find_root.outputs.root_dir || '.' }}
        run: flutter build apk --release

      # هذا الجزء الجديد: يعرض السجل الكامل عند الفشل
      - name: Show full build log on failure
        if: failure()
        run: cat build/app/outputs/logs/*.log || echo "No log file found"

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "app-release.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ لم يتم إنشاء APK"
            exit 1
          fi
          echo "✅ APK: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.find_apk.outputs.apk_path }}
