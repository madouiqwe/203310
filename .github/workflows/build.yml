name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List all files
        run: |
          echo "=== الملفات قبل الفك ==="
          find . -type f -not -path "./.git/*"

      - name: Extract any ZIP file
        run: |
          # تصحيح صيغة البحث عن ملف ZIP
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ لم يتم العثور على ملف ZIP"
            exit 1
          fi
          echo "✅ سيتم فك ضغط: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted
          echo "=== الملفات بعد الفك ==="
          find extracted -type f | head -50

      - name: Find pubspec.yaml
        id: find_pubspec
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -type f -not -path "*/build/*" -not -path "*/.dart_tool/*" | head -1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "❌ لم يتم العثور على pubspec.yaml بعد الفك"
            echo "=== جميع الملفات ==="
            find . -type f -not -path "./.git/*" | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "✅ تم العثور على pubspec.yaml في: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: flutter build apk --release

      - name: Find APK
        id: find_apk
        run: |
          PROJECT_DIR="${{ steps.find_pubspec.outputs.project_dir }}"
          # البحث عن الـ APK داخل مسار المشروع تحديداً لتجنب التعارض
          APK=$(find "$PROJECT_DIR" -name "app-release.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ لم يتم إنشاء APK"
            find "$PROJECT_DIR" -name "*.apk" -type f
            exit 1
          fi
          echo "✅ APK موجود في: $APK"
          
          # استخدام المسار المطلق (Absolute Path) لضمان نجاح عملية الرفع
          ABSOLUTE_APK_PATH=$(realpath "$APK")
          echo "apk_path=$ABSOLUTE_APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error # التأكد من ظهور خطأ إذا لم يتم العثور على الملف
