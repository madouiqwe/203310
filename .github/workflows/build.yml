name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find pubspec.yaml
        id: find_pubspec
        run: |
          # البحث عن pubspec.yaml في كل مكان
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -type f | head -1)
          
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "❌ لم يتم العثور على pubspec.yaml"
            echo "=== جميع الملفات في المستودع ==="
            find . -type f -not -path "./.git/*" | head -50
            exit 1
          fi
          
          # استخراج المجلد الذي يحتوي على pubspec.yaml
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "✅ تم العثور على pubspec.yaml في: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find_pubspec.outputs.project_dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.find_pubspec.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
