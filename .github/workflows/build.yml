name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find project root
        id: find_root
        run: |
          echo "=== البحث عن pubspec.yaml ==="
          ROOT=$(find . -name "pubspec.yaml" -not -path "*/build/*" -not -path "*/.dart_tool/*" | head -1)
          if [ -z "$ROOT" ]; then
            echo "❌ لم يُعثر على pubspec.yaml"
            exit 1
          fi
          ROOT_DIR=$(dirname "$ROOT")
          echo "✅ تم إيجاد المشروع في: $ROOT_DIR"
          echo "root_dir=$ROOT_DIR" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: flutter build apk --release

      - name: Find APK file
        id: find_apk
        run: |
          APK=$(find . -name "app-release.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ لم يتم إنشاء APK"
            exit 1
          fi
          echo "✅ APK موجود في: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.find_apk.outputs.apk_path }}
