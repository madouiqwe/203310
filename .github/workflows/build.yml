name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List initial files
        run: |
          echo "=== محتويات المستودع ==="
          ls -la

      - name: Extract ZIP if exists
        run: |
          # البحث عن أي ملف ZIP في المستودع
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" -type f | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "✅ وجدت ملف ZIP: $ZIP_FILE"
            echo "جاري فك الضغط..."
            unzip -o "$ZIP_FILE" -d extracted
            echo "=== محتويات بعد فك الضغط ==="
            ls -la extracted/
          else
            echo "لا يوجد ملف ZIP، سنعمل مباشرة على الملفات الحالية"
          fi

      - name: Find project root
        id: find_root
        run: |
          # ابحث عن pubspec.yaml في كل مكان
          ROOT=$(find . -name "pubspec.yaml" -not -path "*/build/*" -not -path "*/.dart_tool/*" | head -1)
          if [ -z "$ROOT" ]; then
            echo "❌ لم يُعثر على pubspec.yaml"
            echo "=== كل الملفات في المستودع ==="
            find . -type f -not -path "./.git/*" | head -50
            exit 1
          fi
          ROOT_DIR=$(dirname "$ROOT")
          echo "✅ تم إيجاد المشروع في: $ROOT_DIR"
          echo "root_dir=$ROOT_DIR" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: List project files
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: ls -la

      - name: Get dependencies
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: flutter build apk --release

      - name: Find APK file
        id: find_apk
        run: |
          APK=$(find . -name "app-release.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ لم يتم إنشاء APK"
            find . -name "*.apk" -type f
            exit 1
          fi
          echo "✅ APK موجود في: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.find_apk.outputs.apk_path }}
