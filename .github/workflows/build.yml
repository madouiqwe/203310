name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files at start
        run: |
          echo "=== محتويات المستودع ==="
          ls -la

      - name: Extract ZIP if exists
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" -type f | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "✅ وجدت ZIP: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted
            echo "=== بعد فك الضغط ==="
            ls -la extracted/
          else
            echo "لا يوجد ZIP"
          fi

      - name: Find project root
        id: find_root
        run: |
          ROOT=$(find . -name "pubspec.yaml" -not -path "*/build/*" -not -path "*/.dart_tool/*" | head -1)
          if [ -z "$ROOT" ]; then
            echo "❌ لم يُعثر على pubspec.yaml"
            echo "=== كل الملفات ==="
            find . -type f -not -path "./.git/*" | head -100
            exit 1
          fi
          ROOT_DIR=$(dirname "$ROOT")
          echo "✅ المشروع في: $ROOT_DIR"
          echo "root_dir=$ROOT_DIR" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Show project directory
        run: |
          echo "المسار المكتشف: ${{ steps.find_root.outputs.root_dir }}"
          ls -la "${{ steps.find_root.outputs.root_dir }}"

      - name: Get dependencies
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: flutter build apk --release

      - name: Show build log on failure
        if: failure()
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: |
          echo "=== ملفات السجل ==="
          find . -name "*.log" -type f
          echo ""
          echo "=== محتوى السجلات ==="
          for f in $(find build -name "*.log" -type f 2>/dev/null); do
            echo "--- $f ---"
            cat "$f"
          done

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "app-release.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ لم يتم إنشاء APK"
            exit 1
          fi
          echo "✅ APK: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.find_apk.outputs.apk_path }}
